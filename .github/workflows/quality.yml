name: Python Code Quality Analysis

'on':
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 bandit

      - name: Run Pylint
        run: |
          pylint app.py analyzer.py ai_explainer.py report_generator.py --exit-zero

      - name: Run Flake8
        run: |
          flake8 app.py analyzer.py ai_explainer.py report_generator.py --exit-zero

      - name: Run Bandit Security Scan
        run: |
          bandit -r . --exclude ./venv --severity-level high